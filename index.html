<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMETA — Simulasi Assessment Terpadu</title>
  <link rel="icon" type="image/png" href="askrindo_assessment_icon_transparent.png" />
  <link rel="stylesheet" href="styles.css?v=20261119-9" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Navigation -->
    <header class="topbar">
      <div class="brand" id="btnHome" role="button" tabindex="0">
        <img src="askrindo_assessment_icon_transparent.png" alt="Logo Aplikasi" class="brand-logo-img" />
        <div>
          <div class="brand-title">SIMETA — Simulasi Assessment Terpadu</div>
          <div class="brand-sub">Portal Assessment Center • Kompetensi IFG</div>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="supaStatusBadge" class="pill" style="background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;align-self:center;">● Server: Memeriksa...</span>
        <span id="userSessionBadge" class="pill topbar-user-pill" style="display:none;align-self:center;"></span>
        <button class="btn btn-accent btn-sm" id="btnAdmin" style="display:none;">Kelola Pegawai</button>
        <button class="btn btn-ghost btn-sm" id="btnHistory" style="display:none;">Riwayat Skor</button>
        <button class="btn btn-outline btn-sm" id="btnResetHome" style="display:none;">Beranda</button>
        <button class="btn btn-outline btn-sm" id="btnLogout" style="display:none;">Keluar</button>
      </div>
    </header>

    <!-- Main Container -->
    <main class="main-container" id="appRoot">
      <!-- Rendered dynamically by app.js -->
    </main>
  </div>

  <!-- AI Face Detector (TinyFaceDetector) & App Scripts -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script src="supabase-client.js?v=20261120-3"></script>
  <script src="data/questions-bod3.js?v=20261119-18"></script>
  <script src="data/questions-bod4.js?v=20261119-18"></script>
  <script src="data/questions-bod5.js?v=20261120-2"></script>
  <script src="data/questions-general.js?v=20261119-18"></script>
  <script src="pre-assessment.js?v=20261120-2"></script>
  <script src="portrai-engine.js?v=20261120-3"></script>
  <script src="app.js?v=20261120-4"></script>
</body>
</html>
