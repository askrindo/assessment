<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulasi Asesmen Pegawai — Asuransi Kredit Indonesia (KUR & Non-KUR)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Navigation -->
    <header class="topbar">
      <div class="brand" id="btnHome" role="button" tabindex="0">
        <div class="brand-logo">AK</div>
        <div>
          <div class="brand-title">Simulasi Asesmen Terpadu</div>
          <div class="brand-sub">Asuransi Kredit Indonesia • KUR, Suretyship & Asuransi Umum</div>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="supaStatusBadge" class="pill" style="background:rgba(255,255,255,0.14);color:#e2e8f0;align-self:center;">Supabase: Memeriksa...</span>
        <button class="btn btn-ghost btn-sm" id="btnHistory">Riwayat Skor</button>
        <button class="btn btn-outline btn-sm" id="btnResetHome">Beranda</button>
      </div>
    </header>

    <!-- Main Container -->
    <main class="main-container" id="appRoot">
      <!-- Rendered dynamically by app.js -->
    </main>
  </div>

  <!-- Supabase SDK & Data/App Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="data/questions-bod3.js"></script>
  <script src="data/questions-bod4.js"></script>
  <script src="data/questions-bod5.js"></script>
  <script src="app.js"></script>
</body>
</html>
